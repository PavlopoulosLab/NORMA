[project]
name = "norma-server"
version = "3.0.0"
description = "NORMA 3 server: serves the page, the REST API and the STRING / Arena3D / database relays"
requires-python = ">=3.9"
dependencies = []          # standard library only — keep it that way

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
