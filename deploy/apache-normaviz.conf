# NORMA (normaviz.org) behind Apache httpd, with HTTPS on port 443.
#
# One-time setup on the host:
#   sudo a2enmod proxy proxy_http headers rewrite ssl
#   sudo cp deploy/apache-normaviz.conf /etc/apache2/sites-available/normaviz.org.conf
#   sudo a2ensite normaviz.org.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d normaviz.org -d www.normaviz.org
#
# certbot rewrites the :443 block below in place to add the ssl_certificate
# lines and is safe to re-run; it also adds its own :80 -> :443 redirect if
# one isn't already present (one is, below, so certbot should just reuse it).
#
# NORMA itself must run with server.hosted publicUrl set to https://normaviz.org/
# and server.trustProxy true (see norma.config.hosted.json / docker-compose.yml),
# and must be reachable at 127.0.0.1:8000 (docker-compose.yml already binds it
# there and nowhere else).

<VirtualHost *:80>
    ServerName   normaviz.org
    ServerAlias  www.normaviz.org

    RewriteEngine On
    RewriteRule ^/?(.*)$ https://normaviz.org/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName   normaviz.org
    ServerAlias  www.normaviz.org

    SSLEngine             on
    SSLCertificateFile    /etc/letsencrypt/live/normaviz.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/normaviz.org/privkey.pem
    SSLProtocol           TLSv1.2 TLSv1.3
    SSLCipherSuite        HIGH:!aNULL:!MD5

    # send www.normaviz.org to the apex, over https, before proxying anything
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\.normaviz\.org$ [NC]
    RewriteRule ^/?(.*)$ https://normaviz.org/$1 [R=301,L]

    # NORMA's API payloads run up to 50 MB (see norma.config.hosted.json
    # api.maxMB); the database/Arena3D relays can take up to two minutes.
    LimitRequestBody 62914560
    ProxyTimeout 180
    Timeout      180

    ProxyPreserveHost On
    # server.py only trusts X-Forwarded-Proto to know it's behind HTTPS
    # (server.trustProxy); Apache does not add this header on its own.
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass        / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/
</VirtualHost>

# Serving NORMA under a path instead (https://normaviz.org/norma/):
#   ProxyPass        /norma/ http://127.0.0.1:8000/
#   ProxyPassReverse /norma/ http://127.0.0.1:8000/
#   RequestHeader set X-Forwarded-Prefix "/norma"
#   ...plus the same X-Forwarded-Proto header and limits as above.
