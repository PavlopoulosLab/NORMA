# NORMA behind nginx with HTTPS on port 443 (NAR web server requirement).
# Certificates, e.g. from Let's Encrypt:  certbot --nginx -d norma.example.org
server {
    listen 80;
    server_name norma.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name norma.example.org;

    ssl_certificate     /etc/letsencrypt/live/norma.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/norma.example.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 60m;          # NORMA API payloads up to 50 MB
    proxy_read_timeout   180s;          # database relays can be slow

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}

